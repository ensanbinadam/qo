<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SHRINK - فتح لوحة الإدارة</title>
<meta http-equiv="refresh" content="0; url=go.html" />
<style>
  :root{
    --bg:#f5f7f1; --panel:#ffffff; --line:#dce5d2;
    --ink:#172113; --muted:#5f6d56; --accent:#4f7f00;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:22px;
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7;
  }
  main{
    width:min(520px,100%); background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:28px; box-shadow:0 22px 50px -34px rgba(45,58,35,.38);
  }
  h1{margin:0 0 8px; font-size:24px;}
  p{margin:0 0 18px; color:var(--muted);}
  a{
    display:inline-flex; align-items:center; justify-content:center; min-height:44px;
    padding:10px 16px; border-radius:8px; background:#d9f86a;
    color:var(--ink); text-decoration:none; font-weight:700;
  }
</style>
<script>
  location.replace("go.html");
</script>
</head>
<body>
<main>
  <h1>لوحة إدارة الاختصارات</h1>
  <p>تم نقل أداة الإنشاء والإدارة إلى <b>go.html</b> حتى لا يتم استبدالها بملف فهرس الحزمة.</p>
  <a href="go.html">فتح go.html</a>
</main>
</body>
</html>
